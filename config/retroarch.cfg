# Minimal seed config for RetroArch Switch (libnx).
# RetroArch fills in everything else with defaults on first run.

# Flush SRAM to disk every 60 seconds and on exit, so in-game saves survive
# even if the app is closed from the HOME menu instead of quit cleanly.
autosave_interval = "60"
block_sram_overwrite = "false"

# Saves and states in predictable per-content locations on the SD card.
savefile_directory = "/retroarch/saves"
savestate_directory = "/retroarch/states"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"

# Quality-of-life defaults.
savestate_auto_index = "true"
pause_nonactive = "true"
video_smooth = "false"
menu_driver = "ozone"
